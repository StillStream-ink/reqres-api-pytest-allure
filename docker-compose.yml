version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: reqres_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: reqres_test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mock:
    build: .
    container_name: reqres_mock
    ports:
      - "5000:5000"
    environment:
      - API_ENV=docker
      - DOCKER_ENV=true          # 🆕 关键：告诉 start_mock.py 要等待 MySQL
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=testuser
      - MYSQL_PASSWORD=testpass
      - MYSQL_DB=reqres_test
    depends_on:
      mysql:
        condition: service_healthy
    command: python start_mock.py
    restart: unless-stopped

  test:
    build: .
    container_name: reqres_test
    depends_on:
      mock:
        condition: service_started
    environment:
      - API_ENV=docker
      - RUN_SKIPPED=1
    command: >
      sh -c "
        echo '⏳ 等待 Mock 服务就绪...' &&
        while ! python -c \"import requests; requests.get('http://mock:5000/posts', timeout=1)\" 2>/dev/null; do
          echo '等待 mock:5000...' &&
          sleep 1;
        done &&
        echo '✅ Mock 服务已就绪' &&
        python -m pytest cases/ -v --alluredir=allure-results
      "
    volumes:
      - ./allure-results:/app/allure-results

volumes:
  mysql_data:
