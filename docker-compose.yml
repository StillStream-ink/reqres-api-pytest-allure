services:
  mysql:
    image: mysql:8.0
    container_name: reqres_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: reqres_test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3307:3306"  # 注意这里改过端口，避免和本机冲突
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mock:
    build: .
    container_name: reqres_mock
    ports:
      - "5000:5000"
    volumes:
      - ./test_mock.db:/app/test_mock.db   # ✅ 关键：挂载 SQLite 文件到 mock 容器
    environment:
      - API_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=testuser
      - MYSQL_PASSWORD=testpass
      - MYSQL_DB=reqres_test
      - USE_MYSQL=False    # ✅ 关键：强制使用 SQLite
    depends_on:
      mysql:
        condition: service_healthy
    command: python start_mock.py
    restart: unless-stopped

  test:
    build: .
    container_name: reqres_test
    depends_on:
      mock:
        condition: service_started
    volumes:
      - ./test_mock.db:/app/test_mock.db   # ✅ 关键：挂载同一个文件到 test 容器
      - ./allure-results:/app/allure-results
    environment:
      - API_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=testuser
      - MYSQL_PASSWORD=testpass
      - MYSQL_DB=reqres_test
      - USE_MYSQL=False    # ✅ 关键：强制使用 SQLite
      - RUN_SKIPPED=1
    command: >
      sh -c "sleep 10 && python -m pytest cases/ -v --alluredir=allure-results"

volumes:
  mysql_data: