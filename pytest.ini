[pytest]
testpaths = . cases
addopts = -v --reruns 2 --reruns-delay 1 --alluredir=allure-results
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: 冒烟测试（核心链路，每次提交必跑）
    regression: 回归测试（全量用例）
    db: 数据库相关测试
    docker: Docker 环境下执行的用例
    slow: 执行较慢的用例（如性能测试）