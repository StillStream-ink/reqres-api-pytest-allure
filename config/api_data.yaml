# 文章模块接口数据驱动
posts_list:
  url: "/posts"
  method: "GET"
  expect_code: 200

posts_detail:
  url: "/posts/{post_id}"
  method: "GET"
  expect_code: 200

posts_create:
  url: "/posts"
  method: "POST"
  json:
    title: "yaml数据驱动新增"
    body: "数据和脚本分离，YAML管理测试数据"
    userId: 1
  expect_code: 201

posts_update:
  url: "/posts/{post_id}"
  method: "PUT"
  json:
    title: "YAML更新后的标题"
  expect_code: 200

posts_delete:
  url: "/posts/{post_id}"
  method: "DELETE"
  expect_code: 200

# ==================== 🆕 商品模块（完整 CRUD） ====================
products_list:
  url: "/products"
  method: "GET"
  expect_code: 200

products_detail:
  url: "/products/{product_id}"
  method: "GET"
  expect_code: 200

products_create:
  url: "/products"
  method: "POST"
  json:
    name: "YAML驱动的商品"
    price: 99.99
  expect_code: 201

products_update:
  url: "/products/{product_id}"
  method: "PUT"
  json:
    name: "YAML更新后的商品名"
    price: 199.99
  expect_code: 200

products_delete:
  url: "/products/{product_id}"
  method: "DELETE"
  expect_code: 200