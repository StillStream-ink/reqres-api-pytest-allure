# 文章模块接口数据
post_list:
  name: 获取文章列表
  method: GET
  url: /posts
  expect_code: 200
  check:
    is_list: true
    has_keys: ["id", "title"]

post_single:
  name: 获取单篇文章
  method: GET
  url: /posts/1
  expect_code: 200
  check:
    equal: {"id": 1}
    type: {"title": "str", "userId": "int"}

post_param:
  name: 参数化查询文章
  method: GET
  url: /posts/{post_id}
  params_list: [1,2,3,4]
  expect_code: 200
  check:
    equal: {"id": "{post_id}"}
    type: {"title": "str"}

post_create:
  name: 新增文章
  method: POST
  url: /posts
  json:
    title: "自动化测试文章"
    body: "接口自动化demo"
    userId: 1
  expect_code: 201
  check:
    equal: {"title": "自动化测试文章"}
    has_keys: ["id"]

post_update:
  name: 修改文章
  method: PUT
  url: /posts/1
  json:
    title: "更新后的标题"
    body: "修改内容"
    userId: 1
  expect_code: 200
  check:
    equal: {"title": "更新后的标题"}

post_delete:
  name: 删除文章
  method: DELETE
  url: /posts/1
  expect_code: 200

# 用户模块鉴权接口
user_info:
  name: 用户信息查询（带token）
  method: GET
  url: /users/2
  expect_code: 200
  check:
    equal: {"id": 2}
    has_keys: ["name"]

# ========== 业务链路：文章完整生命周期（适配jsonplaceholder） ==========
post_flow_get:
  name: 业务链路-查询文章
  method: GET
  url: /posts/{flow_post_id}
  expect_code: 200
  check:
    equal: {"id": 1}

post_flow_update:
  name: 业务链路-修改文章
  method: PUT
  url: /posts/{flow_post_id}
  json:
    title: "链路测试-标题已更新"
    body: "业务流程-修改操作"
    userId: 1
  expect_code: 200
  check:
    equal: {"title": "链路测试-标题已更新"}

post_flow_delete:
  name: 业务链路-删除文章
  method: DELETE
  url: /posts/{flow_post_id}
  expect_code: 200

