name: Api Auto Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-job:
    runs-on: windows‑latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest allure-pytest pyyaml

      - name: 执行pytest，生成allure结果数据
        run: pytest test_api_demo.py -vs --alluredir=allure-results

      - name: 上传allure原始结果（工件保存）
        uses: actions/upload-artifact@v4
        with:
          name: allure‑raw‑data
          path: allure-results
