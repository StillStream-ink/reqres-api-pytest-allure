name: Api Auto Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-job:
    runs-on: windows-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest allure-pytest pyyaml pymysql

      - name: 执行pytest，生成allure结果数据
        run: |
          mkdir -p allure-results
          pytest test_api_demo.py -v --alluredir=allure-results

      - name: 执行自定义质量门禁
        run: python common/quality_gate.py

      - name: 部署 Allure 报告到 Pages
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: allure-results
          allure_report: allure-report
          keep_reports: 10
