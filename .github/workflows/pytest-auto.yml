name: 质量门禁-校验用例通过率

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    # 👇 这是关键：用 services 让 GitHub 官方帮你管理 MySQL
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: Toward123456
          MYSQL_DATABASE: my_test_db
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pToward123456"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 运行 pytest 生成 Allure 结果
        run: |
          mkdir -p allure-results
          pytest --alluredir=allure-results --clean-alluredir

      - name: 5. 安装 Java 17（Allure 依赖）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. 下载并安装 Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz -C /opt/
          echo "/opt/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: 7. 生成 Allure HTML 报告
        run: |
          allure generate allure-results -o allure-report --clean

      - name: 8. 部署报告到 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: allure-report
          branch: gh-pages
