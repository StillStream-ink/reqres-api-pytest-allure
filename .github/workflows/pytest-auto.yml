name: 质量门禁-校验用例通过率
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Toward123456
          MYSQL_DATABASE: my_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装项目依赖
        run: |
          pip install -r requirements.txt

      - name: 安装 Allure 命令行工具
        run: |
          sudo apt-get update
          sudo apt-get install -y allure

      - name: 后台启动 Mock Server
        run: |
          python common/mock_server.py &
          sleep 5
          curl -s http://127.0.0.1:5000/health || exit 1

      - name: 执行 pytest，生成 allure 结果数据
        run: |
          pytest cases/ --reruns 2 -v -s --alluredir=allure-results

      - name: 生成 Allure HTML 报告
        run: |
          allure generate allure-results -o allure-report --clean

      - name: 执行自定义质量门禁
        run: python common/quality_gate.py

      - name: 部署 Allure 报告到 Pages
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          branch: gh-pages
