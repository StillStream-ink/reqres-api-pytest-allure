name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发

jobs:
  api-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Allure 命令行
        run: |
          sudo apt update
          sudo apt install -y allure

      - name: 执行接口自动化测试
        run: pytest test_api_demo.py -v --alluredir=allure-results
        continue-on-error: true  # 测试失败也继续，保证报告能生成

      - name: 生成 Allure 报告
        run: allure generate allure-results -o allure-report --clean

      - name: 上传 Allure 报告
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30  # 保留30天

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 30
