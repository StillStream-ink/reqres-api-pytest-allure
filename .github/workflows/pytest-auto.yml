name: 质量门禁-校验用例通过率

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests allure-pytest pyyaml flask tenacity pymysql pytest-rerunfailures

      - name: Start MySQL
        run: |
          docker compose up -d
          sleep 15

      - name: Create allure-results directory
        run: |
          mkdir -p allure-results
          chmod 777 allure-results
          
      - name: Run tests with Allure
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest cases -v --alluredir=./allure-results
          
      - name: Quality Gate
        run: python common/quality_gate.py

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
