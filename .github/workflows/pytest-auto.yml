name: 质量门禁-校验用例通过率

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Toward123456
          MYSQL_DATABASE: my_test_db
        ports:
          - 3307:3306   # ← 宿主机3307映射到容器3306，匹配代码配置
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests allure-pytest pyyaml flask tenacity pymysql pytest-rerunfailures

      - name: Create allure-results directory
        run: |
          sudo rm -rf allure-results
          mkdir -p allure-results
          chmod 777 allure-results

      - name: Run tests with Allure
        run: |
          pytest --reruns 2 -v -s --alluredir=allure-results cases/

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
