name: 质量门禁-校验用例通过率

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动 MySQL 8.0 容器
        run: |
          docker rm -f mysql 2>/dev/null || true
          docker run -d --name mysql -p 127.0.0.1:3306:3306 -e MYSQL_ROOT_PASSWORD=Toward123456 -e MYSQL_DATABASE=my_test_db mysql:8.0 --default-authentication-plugin=mysql_native_password

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -pToward123456 --silent && echo "MySQL is ready!" && exit 0
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: 运行 pytest 生成 Allure 结果
        run: |
          mkdir -p allure-results
          pytest -s -q --alluredir=allure-results

      - name: 安装 Allure CLI
        run: |
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz | tar xz -C /opt/
          echo "/opt/allure-2.29.0/bin" >> $GITHUB_PATH

      - name: 生成 Allure 报告
        run: |
          allure generate allure-results -o allure-report --clean

      - name: 发布 Allure 报告到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: true
