name: 质量门禁-校验用例通过率

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests allure-pytest pyyaml flask tenacity pymysql pytest-rerunfailures

      - name: Start MySQL
        run: |
          # 后台启动数据库容器
          docker compose up -d
          
          # 主动探测 MySQL 端口 (3306) 是否真正开始监听
          echo "Waiting for MySQL to be ready..."
          timeout=60
          while ! nc -z localhost 3306; do   
            sleep 1
            timeout=$((timeout-1))
            if [ $timeout -le 0 ]; then
              echo "MySQL failed to start in time."
              exit 1
            fi
          done
          echo "MySQL is ready!"

      - name: Create allure-results directory
        run: |
          sudo rm -rf allure-results
          mkdir -p allure-results

      - name: Run tests with Allure
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest cases -v --alluredir=./allure-results
          
      - name: Quality Gate
        run: python common/quality_gate.py

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
