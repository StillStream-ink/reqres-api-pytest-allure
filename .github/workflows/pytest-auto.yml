name: 质量门禁-校验用例通过率

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 赋予工作流写入仓库和部署 Pages 的权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 0. 强制清理环境
        run: |
          docker rm -f mysql 2>/dev/null || true
          docker system prune -f
          sudo rm -rf allure-results allure-report
          echo "环境已重置"

      - name: 4. MySQL 8.0 容器
        run: |
          docker rm -f mysql 2>/dev/null || true
          docker run -d --name mysql -p 127.0.0.1:3306:3306 -e MYSQL_ROOT_PASSWORD=Toward123456 -e MYSQL_DATABASE=my_test_db mysql:8.0 --default-authentication-plugin=mysql_native_password

      - name: 5. 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -pToward123456 --silent; then
              echo "MySQL is ready!"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL failed to start" && exit 1

      - name: 6. 运行 pytest 生成 Allure 结果
        run: |
          mkdir -p allure-results
          pytest --alluredir=allure-results --clean-alluredir

      - name: 7. 安装 Allure 命令行工具
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 8. 下载并解压 Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz -C /opt/
          echo "/opt/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: 9. 生成 Allure HTML 报告
        run: |
          allure generate allure-results -o allure-report --clean

      - name: 10. 部署报告到 GitHub Pages (gh-pages 分支)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: allure-report
          branch: gh-pages
